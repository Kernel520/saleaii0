<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="aii0.com 四字符域名出售，欢迎来信询价。">
<title>aii0.com · 域名出售</title>
<style>
  * { box-sizing: border-box; }
  :root { font: 16px/1.6 system-ui, sans-serif; color: #192b24; background: #f8f9f4; }
  body { margin: 0; }
  a { color: inherit; }
  .site { min-height: 100vh; background: #f8f9f4; }
  header, footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px clamp(16px, 5vw, 76px); flex-wrap: wrap; }
  header { border-bottom: 1px solid #dce4d9; }
  .wordmark { font-weight: 800; text-decoration: none; letter-spacing: -.04em; }
  .hero { padding: clamp(40px, 7vw, 100px) 16px 0; text-align: center; }
  .kicker { font: 700 .78rem/1.5 ui-monospace, monospace; letter-spacing: .15em; color: #2d6552; }
  h1 { margin: 0; font-size: clamp(3.5rem, 12vw, 9rem); line-height: 1; letter-spacing: -.085em; }
  .subtitle { margin: 18px auto 24px; color: #42554b; }
  .button { display: inline-block; padding: 10px 18px; border-radius: 8px; border: 1px solid #214537; background: #214537; color: #fff; text-decoration: none; font: inherit; cursor: pointer; }
  .button:hover { background: #35654f; }
  :focus-visible { outline: 3px solid #2377c5; outline-offset: 4px; }
  figure { position: relative; max-width: 1220px; margin: 36px auto 0; overflow: hidden; border: 1px solid #749b8a; border-radius: 12px; background: #75c7f6; }
  figure img { display: block; width: 100%; aspect-ratio: 16/9; min-height: 260px; object-fit: cover; image-rendering: pixelated; }
  figcaption { position: absolute; right: 5%; bottom: 10%; padding: 9px 13px; border: 1px solid #263b31; background: #fffdf1; box-shadow: 4px 4px #263b31; font: .8rem ui-monospace, monospace; }
  .info { max-width: 940px; margin: auto; padding: 64px 20px; }
  h2 { font-size: clamp(1.8rem, 5vw, 3rem); letter-spacing: -.06em; margin: 0; }
  dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  dl div { border: 1px solid #d0ddcf; background: #eef4eb; padding: 16px; }
  dt { color: #455d50; }
  dd { margin: 0; font: 700 1.4rem ui-monospace, monospace; }
  details { border-block: 1px solid #d0ddcf; padding: 14px 0; }
  summary { cursor: pointer; }
  footer { border-top: 1px solid #dce4d9; }
</style>
</head>
<body>
<div class="site">
  <header><a class="wordmark" href="./">aii0.com</a><a href="#contact">购买咨询 ↗</a></header>
  <main>
    <section class="hero" aria-labelledby="domain">
      <p class="kicker">DOMAIN FOR SALE</p>
      <h1 id="domain">aii0.com</h1>
      <p class="subtitle">一个四字符 .com 域名，正在寻找下一位主人。</p>
      <a class="button" href="mailto:email@aii0.com?subject=aii0.com%20%E8%AF%A2%E4%BB%B7">邮件询价 ↗</a>
      <figure>
        <img src="park.png" alt="像素画中的蓝天、草地和一台打开的电脑" fetchpriority="high">
        <figcaption>aii0.com · 价格面议</figcaption>
      </figure>
    </section>
    <section class="info" id="contact" aria-labelledby="contact-title">
      <p class="kicker">ABOUT THE DOMAIN</p>
      <h2 id="contact-title">域名信息</h2>
      <dl><div><dt>名称</dt><dd>aii0</dd></div><div><dt>后缀</dt><dd>.com</dd></div><div><dt>价格</dt><dd>面议</dd></div></dl>
      <details><summary>如何询价或报价？</summary><p>写信至 <a href="mailto:email@aii0.com">email@aii0.com</a>，注明域名 aii0.com。已有报价时，可以附上金额和币种。</p></details>
    </section>
  </main>
  <footer><span>aii0.com · 域名出售</span><a href="mailto:email@aii0.com">email@aii0.com</a></footer>
</div>
</body>
</html>
